services:
  db:
    image: postgres:16
    container_name: resume_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro        # CSVs visible inside the container
      - ./sql:/sql:ro          # SQL scripts visible inside the container

volumes:
  pgdata: